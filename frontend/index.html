<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Pal — Discover India</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        /* ── Header ─────────────────────────────── */
        header {
            text-align: center;
            padding: 40px 20px 20px;
            color: white;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* ── Main container ─────────────────────── */
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px 40px;
        }

        /* ── Form card ──────────────────────────── */
        .form-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }
        .form-card h2 {
            margin-bottom: 20px;
            color: #555;
            font-size: 1.2rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
            font-size: 0.9rem;
        }
        .form-group select,
        .form-group input {
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Interests checkboxes */
        .interests-section {
            grid-column: 1 / -1;
        }
        .interests-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
        }
        .interest-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: #f0f0f0;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .interest-chip:hover {
            background: #e0e0ff;
        }
        .interest-chip input {
            accent-color: #667eea;
        }
        .interest-chip.selected {
            background: #667eea;
            color: white;
        }

        /* Submit button */
        .btn-submit {
            grid-column: 1 / -1;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Results section ────────────────────── */
        .results-section {
            display: none;
        }
        .results-section.visible {
            display: block;
        }
        .results-header {
            color: white;
            margin-bottom: 16px;
            font-size: 1.3rem;
        }

        /* Destination cards */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .dest-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: transform 0.2s;
        }
        .dest-card:hover {
            transform: translateY(-3px);
        }

        .dest-info h3 {
            font-size: 1.15rem;
            color: #333;
            margin-bottom: 6px;
        }
        .dest-meta {
            font-size: 0.85rem;
            color: #777;
            line-height: 1.6;
        }
        .dest-meta span {
            margin-right: 14px;
        }

        .dest-stats {
            text-align: right;
            flex-shrink: 0;
            margin-left: 20px;
        }
        .dest-rating {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
        }
        .dest-rating small {
            font-size: 0.7rem;
            color: #999;
            font-weight: 400;
        }
        .dest-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 6px;
        }
        .badge-hidden-gem {
            background: #fff3cd;
            color: #856404;
        }
        .badge-well-known {
            background: #d4edda;
            color: #155724;
        }
        .dest-score {
            font-size: 0.75rem;
            color: #999;
            margin-top: 4px;
        }

        /* ── Loading & Error ────────────────────── */
        .loading {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 1.1rem;
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 14px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /* ── Detail Modal ───────────────────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 16px 16px 0 0;
        }
        .modal-body {
            padding: 24px;
        }
        .modal-body h2 {
            font-size: 1.4rem;
            margin-bottom: 4px;
            color: #333;
        }
        .modal-location {
            color: #667eea;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        .modal-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .modal-detail-item {
            background: #f5f5ff;
            padding: 10px 14px;
            border-radius: 10px;
        }
        .modal-detail-item .label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }
        .modal-detail-item .value {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
        }
        .modal-close {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-close:hover {
            opacity: 0.9;
        }

        /* ── Footer ─────────────────────────────── */
        footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<header>
    <h1>🧳 Travel Pal</h1>
    <p>Discover amazing destinations across India</p>
</header>

<div class="container">
    <!-- Search Form -->
    <div class="form-card">
        <h2>Tell us your preferences</h2>
        <form id="searchForm" class="form-grid">

            <div class="form-group">
                <label for="budget">💰 Budget</label>
                <select id="budget">
                    <option value="low">Low Budget</option>
                    <option value="mid" selected>Mid Budget</option>
                    <option value="high">High Budget</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duration">📅 Duration (days)</label>
                <input type="number" id="duration" min="1" max="30" value="3">
            </div>

            <div class="form-group">
                <label for="category">🏷️ Category</label>
                <select id="category">
                    <option value="all">All Destinations</option>
                    <option value="hidden_gem">Hidden Gems Only</option>
                    <option value="well_known">Well-Known Only</option>
                </select>
            </div>

            <div class="form-group">
                <label for="topN">🔢 Number of Results</label>
                <input type="number" id="topN" min="1" max="50" value="10">
            </div>

            <div class="form-group interests-section">
                <label>🎯 Interests (select one or more)</label>
                <div class="interests-grid" id="interestsGrid">
                    <!-- Filled by JavaScript -->
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                🔍 Get Recommendations
            </button>
        </form>
    </div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg" style="display:none;"></div>

    <!-- Loading -->
    <div class="loading" id="loading" style="display:none;">
        <div class="spinner"></div>
        <div>Finding the best destinations for you...</div>
    </div>

    <!-- Results -->
    <div class="results-section" id="resultsSection">
        <h2 class="results-header" id="resultsHeader"></h2>
        <div class="cards-grid" id="cardsGrid"></div>
    </div>
</div>

<footer>
    Travel Pal v0.5.0 — MLOps Travel Recommendation System
</footer>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <img class="modal-image" id="modalImage" src="" alt="Destination">
        <div class="modal-body">
            <h2 id="modalName"></h2>
            <div class="modal-location" id="modalLocation"></div>
            <div class="modal-details">
                <div class="modal-detail-item">
                    <div class="label">Type</div>
                    <div class="value" id="modalType"></div>
                </div>
                <div class="modal-detail-item">
                    <div class="label">Significance</div>
                    <div class="value" id="modalSignificance"></div>
                </div>
                <div class="modal-detail-item">
                    <div class="label">Rating</div>
                    <div class="value" id="modalRating"></div>
                </div>
                <div class="modal-detail-item">
                    <div class="label">Entrance Fee</div>
                    <div class="value" id="modalFee"></div>
                </div>
                <div class="modal-detail-item">
                    <div class="label">Time Needed</div>
                    <div class="value" id="modalTime"></div>
                </div>
                <div class="modal-detail-item">
                    <div class="label">Category</div>
                    <div class="value" id="modalCategory"></div>
                </div>
            </div>
            <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8000";

    // ── Interest options ──────────────────────────
    const INTERESTS = [
        "Temple", "Historical", "Beach", "Fort", "Museum",
        "Park", "Lake", "Waterfall", "Wildlife", "Mountain",
        "Palace", "Garden", "Cave", "Market", "Bridge"
    ];

    // Build interest chips
    const grid = document.getElementById("interestsGrid");
    INTERESTS.forEach(interest => {
        const label = document.createElement("label");
        label.className = "interest-chip";
        label.innerHTML = `
            <input type="checkbox" value="${interest}">
            ${interest}
        `;
        label.addEventListener("click", () => {
            setTimeout(() => {
                const cb = label.querySelector("input");
                label.classList.toggle("selected", cb.checked);
            }, 0);
        });
        grid.appendChild(label);
    });

    // ── Form submit ───────────────────────────────
    document.getElementById("searchForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById("submitBtn");
        const loading = document.getElementById("loading");
        const errorMsg = document.getElementById("errorMsg");
        const resultsSection = document.getElementById("resultsSection");

        // Get selected interests
        const interests = [];
        document.querySelectorAll("#interestsGrid input:checked").forEach(cb => {
            interests.push(cb.value);
        });

        const payload = {
            budget: document.getElementById("budget").value,
            duration_days: parseInt(document.getElementById("duration").value),
            interests: interests,
            top_n: parseInt(document.getElementById("topN").value),
            category: document.getElementById("category").value,
        };

        // UI state: loading
        submitBtn.disabled = true;
        loading.style.display = "block";
        errorMsg.style.display = "none";
        resultsSection.classList.remove("visible");

        try {
            const response = await fetch(`${API_URL}/recommendations`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.detail || `Error ${response.status}`);
            }

            const data = await response.json();
            renderResults(data.recommendations, payload);

        } catch (err) {
            errorMsg.textContent = `❌ ${err.message}`;
            errorMsg.style.display = "block";
        } finally {
            submitBtn.disabled = false;
            loading.style.display = "none";
        }
    });

    // ── Render results ────────────────────────────
    function renderResults(recommendations, query) {
        const section = document.getElementById("resultsSection");
        const header = document.getElementById("resultsHeader");
        const grid = document.getElementById("cardsGrid");

        header.textContent = `📍 ${recommendations.length} destinations found`;
        grid.innerHTML = "";

        recommendations.forEach((dest, i) => {
            const badgeClass = dest.category === "Hidden Gem"
                ? "badge-hidden-gem" : "badge-well-known";

            const card = document.createElement("div");
            card.className = "dest-card";
            card.innerHTML = `
                <div class="dest-info">
                    <h3>${i + 1}. ${dest.name}</h3>
                    <div class="dest-meta">
                        <span>📍 ${dest.city}, ${dest.state}</span><br>
                        <span>🏛️ ${dest.type}</span>
                        <span>🌟 ${dest.significance}</span><br>
                        <span>💰 ₹${dest.entrance_fee_inr}</span>
                        <span>⏱️ ${dest.time_needed_hrs} hrs</span>
                    </div>
                </div>
                <div class="dest-stats">
                    <div class="dest-rating">${dest.avg_rating.toFixed(1)} <small>/ 5</small></div>
                    <div class="dest-badge ${badgeClass}">${dest.category}</div>
                    ${dest.score > 0 ? `<div class="dest-score">Match: ${(dest.score * 100).toFixed(0)}%</div>` : ""}
                </div>
            `;
            grid.appendChild(card);
        });

        section.classList.add("visible");
    }
</script>

</body>
</html>
